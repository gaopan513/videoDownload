name: iOS prototype IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-prototype-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('scripts').glob('*.sh'):
              assert b'\r' not in path.read_bytes(), f'{path}: CR characters are not allowed'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: ios/package-lock.json
      - name: Build mobile UI
        run: |
          npm ci
          npm run build
          node --test scripts/test-ios-resolver.mjs
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          fixtures = Path('ios/Tests/Fixtures')
          for name, expected in json.loads((fixtures / 'sha256.json').read_text()).items():
              assert hashlib.sha256((fixtures / name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Test HLS parser and cookie boundaries
        run: swift test --package-path ios/Core
      - uses: actions/cache@v4
        id: media
        with:
          path: ios/.tools/ios-media
          key: ios-media-${{ runner.arch }}-xcode26.3-${{ hashFiles('ios/scripts/build-ios-media.sh') }}
      - name: Build pinned FFmpeg libraries
        if: steps.media.outputs.cache-hit != 'true'
        run: bash scripts/build-ios-media.sh
      - name: Build pinned XcodeGen
        run: |
          git clone --depth 1 --branch 2.44.1 https://github.com/yonaskolb/XcodeGen.git .tools/XcodeGen
          swift build --package-path .tools/XcodeGen -c release --product xcodegen
      - name: Test native media and archive unsigned IPA
        run: bash scripts/package-ios.sh
      - name: Upload IPA and installation material
        if: ${{ always() && hashFiles('ios/release/StreamHarbor-iOS-unsigned.ipa') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: StreamHarbor-iOS-prototype
          path: ios/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            ios/.tools/ios-build/*.log
            ios/.tools/ios-build/*.xcresult
            ios/.tools/ios-media/*/build/*-output.txt
            ios/.tools/ios-media/*/dav1d-build/meson-logs/*.txt
          retention-days: 7
